# skeleton template · genome: corpus/store.md · remove this line at instantiation
# The store's generic tables; machine-computed fields split from user-judgment fields
# (the user layer is never overwritten). Registers are VIEWS of store entities once the
# A7 engine lands; markdown-with-shape is the bootstrap.
# Scoring folds available to consumers (knobs live in the CONSUMER's config, never here):
#   estimate (Bayesian posterior, confidence->precision, half-life decay, mean±sigma)
#   balance  (decay-weighted signed event account)
#   forecast (Bayesian odds revision, Brier-scored at resolution)
#   bands    (score -> label map)

engine: markdown          # A7 answer; migrating engines never changes the shapes
# Generic tables only (corpus/store.md). Each project owns its vocabulary in its own
# schemas.yaml: entity kinds, field meanings, weights and bands.
#   hub/schemas.yaml           task model, tasks, deadlines, dispositions, claims, decision, failure_row
#   career/schemas.yaml        signal, theme, event
#   compensation/schemas.yaml  resource
# One truth database per project; no table here spans projects.
tables:
  entities:               # one row per typed thing; kind names a project schema entry
    fields: [id, project, kind, slug, fields, created, revision]
  assessments:            # append-only; corrections are new rows, never edits
    fields: [id, entity, dimension, value, direction, valid_time, recorded_time, source, confidence, evidence, config_version]
    direction: [supports, disputes, neutral]   # default supports; neutral adds nothing to the folds
    valid_time: caller    # when the assessed thing was true; decay runs on it
    recorded_time: store  # stamped by the store's clock, never the caller's
    source: [machine, user]                    # the user layer is never overwritten
  relations:              # typed edges between entities
    fields: [id, from, to, kind, valid_time, recorded_time, evidence]
  events:                 # the ledger of state moves and dated happenings
    fields: [id, entity, kind, at, recorded_time, detail]
  candidates:             # the intake inbox
    fields: [id, source, stable_id, kind, payload, state, received, judged, closed, reason, reopen_condition, reopened_by, duplicate_of]
    states: [received, judged, accepted, dropped]
    unique: [source, stable_id]                # a re-handoff never revives a drop
    dropped_requires: [reason, reopen_condition]
